# =============================================================================
# Bulletin - Production Overrides
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Symfony API - Production
  # ---------------------------------------------------------------------------
  symfony-api:
    build:
      target: prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # React Frontend - Production (static build served by nginx)
  # ---------------------------------------------------------------------------
  react-app:
    build:
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL - Production
  # ---------------------------------------------------------------------------
  postgresql:
    restart: unless-stopped
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bulletin} -d ${POSTGRES_DB:-bulletin}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Do not expose ports in production - internal network only

  # ---------------------------------------------------------------------------
  # Redis - Production with persistence
  # ---------------------------------------------------------------------------
  redis:
    restart: unless-stopped
    command: redis-server --save 60 1000 --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Nginx - Production Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx-proxy:
    restart: unless-stopped
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount SSL certificates (provide your own)
      # - /etc/letsencrypt/live/yourdomain.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      # - /etc/letsencrypt/live/yourdomain.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata-prod:
  redis-prod:
