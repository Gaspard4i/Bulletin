# =============================================================================
# Bulletin - Base Docker Compose Configuration
# =============================================================================
# Usage:
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

name: bulletin

services:
  # ---------------------------------------------------------------------------
  # Symfony API (PHP-FPM)
  # ---------------------------------------------------------------------------
  symfony-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bulletin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgresql:5432/${POSTGRES_DB:-bulletin}?serverVersion=16&charset=utf8"
      APP_SECRET: "${APP_SECRET:?APP_SECRET must be set}"
      JWT_PASSPHRASE: "${JWT_PASSPHRASE:-}"
      REDIS_URL: "redis://redis:6379"
      MAILER_DSN: "${MAILER_DSN:-null://null}"
      CAS_BASE_URL: "${CAS_BASE_URL:-}"
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:-^https?://localhost(:[0-9]+)?$}"
    depends_on:
      - postgresql
      - redis
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # React Frontend
  # ---------------------------------------------------------------------------
  react-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bulletin}"
      POSTGRES_USER: "${POSTGRES_USER:-bulletin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # Redis Cache & Sessions
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:alpine
    depends_on:
      - symfony-api
      - react-app
    networks:
      - bulletin-network

networks:
  bulletin-network:
    driver: bridge
