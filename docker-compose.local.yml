# =============================================================================
# Bulletin - Local Development with Traefik.me (HTTPS)
# =============================================================================
# Usage: ./setup-local.sh
# Access:
#   Frontend: https://bulletin.traefik.me
#   Backend:  https://api.bulletin.traefik.me
#   Mailpit:  http://localhost:8025
#   PgAdmin:  http://localhost:5050 (optional)
# =============================================================================

name: bulletin-local

services:
  # ---------------------------------------------------------------------------
  # Traefik - Reverse Proxy with automatic HTTPS via traefik.me
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # Symfony API (PHP-FPM)
  # ---------------------------------------------------------------------------
  symfony-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: "bulletin-local-dev-secret-change-me"
      DATABASE_URL: "postgresql://bulletin:bulletin_secret@postgresql:5432/bulletin?serverVersion=16&charset=utf8"
      JWT_PASSPHRASE: "bulletin-jwt-local-dev"
      REDIS_URL: "redis://redis:6379"
      MAILER_DSN: "smtp://mailpit:1025"
      CAS_BASE_URL: "https://cas.univ-lille.fr/cas"
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      FRONTEND_URL: "https://bulletin.traefik.me"
      CORS_ALLOW_ORIGIN: "^https?://(bulletin\\.traefik\\.me|localhost)(:[0-9]+)?$$"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # Nginx - API Gateway
  # ---------------------------------------------------------------------------
  nginx-api:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/traefik-api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/app/public:ro
    depends_on:
      - symfony-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.bulletin.traefik.me`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=80"
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # React Frontend - Vite Dev Server
  # ---------------------------------------------------------------------------
  react-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: "https://api.bulletin.traefik.me"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`bulletin.traefik.me`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bulletin
      POSTGRES_USER: bulletin
      POSTGRES_PASSWORD: bulletin_secret
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulletin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    networks:
      - bulletin-network

  # ---------------------------------------------------------------------------
  # Mailpit - Email Testing
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      - bulletin-network

volumes:
  pgdata-local:
  backend-vendor:
  frontend-node-modules:

networks:
  bulletin-network:
    driver: bridge
