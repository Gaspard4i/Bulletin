# =============================================================================
# Development Nginx Configuration - Reverse Proxy
# =============================================================================

upstream php-fpm {
    server symfony-api:9000;
}

upstream vite-dev {
    server react-app:3000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # -------------------------------------------------------------------------
    # API requests -> Symfony backend (PHP-FPM)
    # -------------------------------------------------------------------------
    location /api {
        # Rewrite to route through Symfony's front controller
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        internal;
    }

    # -------------------------------------------------------------------------
    # WebSocket support for Vite HMR
    # -------------------------------------------------------------------------
    location /ws {
        proxy_pass http://vite-dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Vite HMR specific endpoint
    location /@vite/ {
        proxy_pass http://vite-dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # Frontend -> Vite dev server
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://vite-dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block access to dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
