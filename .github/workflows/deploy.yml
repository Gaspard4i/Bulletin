# =============================================================================
# Bulletin - Deploy Pipeline
# =============================================================================

name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/bulletin

jobs:
  # ---------------------------------------------------------------------------
  # Build & Push Backend Docker Image
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "$GITHUB_SHA" | head -c 7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag=${TIMESTAMP}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha,scope=backend-deploy
          cache-to: type=gha,mode=max,scope=backend-deploy

  # ---------------------------------------------------------------------------
  # Deploy Frontend to Cloudflare Pages
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0acc43c7e752bae4b4bae269c8bdda83
          command: pages deploy frontend/dist --project-name=bulletin

  # ---------------------------------------------------------------------------
  # Deploy Backend to VPS
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to production
    runs-on: ubuntu-latest
    needs: build-backend
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH || '/opt/bulletin' }}

            # Pull latest images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE_TAG="${{ needs.build-backend.outputs.image_tag }}"
            export API_IMAGE="${{ env.IMAGE_PREFIX }}-api:${IMAGE_TAG}"

            docker pull "${API_IMAGE}"

            # Update running containers (no postgresql service — using Supabase)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build

            # Run migrations against Supabase
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T symfony-api php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

            # Warm Symfony cache
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T symfony-api php bin/console cache:warmup --env=prod

            # Verify health
            sleep 10
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            echo "Deployment complete: ${IMAGE_TAG}"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/bulletin' }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps --format "table {{.Name}}\t{{.Status}}"

            # Check that all services are healthy/running
            UNHEALTHY=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps --format json | grep -c '"Health":"unhealthy"' || true)
            if [ "$UNHEALTHY" -gt 0 ]; then
              echo "WARNING: $UNHEALTHY unhealthy service(s) detected"
              exit 1
            fi
            echo "All services healthy"
